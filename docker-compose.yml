services:
  # 로컬에서도 운영과 같은 PostgreSQL 스키마를 검증하기 위한 개발용 DB다.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easylife
      POSTGRES_USER: easylife
      POSTGRES_PASSWORD: easylife_local
    ports:
      - "5432:5432"
    volumes:
      # 최초 컨테이너 생성 시 검색 인덱스와 변경 이력 테이블까지 자동 생성한다.
      - easylife_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easylife"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  easylife_pg:
